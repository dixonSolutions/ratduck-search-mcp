name: Release

# Distribution is GitHub Pages, not npm. Every push to main rebuilds the
# tarball and redeploys the site, so the `latest` URL always matches main.
# When package.json's version changes, the commit is also tagged and a GitHub
# Release is cut with the tarball attached — Releases are the permanent,
# immutable home of every version; Pages is the install surface in front of it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Read version
        id: version
        run: |
          NAME="$(node -p "require('./package.json').name")"
          VERSION="$(node -p "require('./package.json').version")"
          echo "name=$NAME"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=${NAME}-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "is_new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is already released; redeploying the site only"
          else
            echo "is_new=true" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION is new; it will be tagged and released"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install and verify
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Pack
        run: |
          npm pack --pack-destination .
          ls -l "${{ steps.version.outputs.tarball }}"

      - name: Tag and release
        if: steps.version.outputs.is_new == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag \
            "${{ steps.version.outputs.tarball }}"

      - name: Assemble the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.version.outputs.name }}
          VERSION: ${{ steps.version.outputs.version }}
          TARBALL: ${{ steps.version.outputs.tarball }}
        run: node scripts/build-site.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Summary
        run: |
          {
            echo "### ${{ steps.version.outputs.name }} v${{ steps.version.outputs.version }}"
            echo
            echo "Site: ${{ steps.deploy.outputs.page_url }}"
            echo
            echo '```bash'
            echo "npm install -g ${{ steps.deploy.outputs.page_url }}${{ steps.version.outputs.name }}-latest.tgz"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
